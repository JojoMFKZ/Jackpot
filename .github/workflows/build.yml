name: Build ODDKIN

# Every push builds the Mac and Windows installers (download them from the run's Artifacts).
# Pushes to main also publish them as a GitHub Release with two downloads:
#   ODDKIN-Installer-Mac.pkg  and  ODDKIN-Installer-Windows.exe
# These always point at the newest version:
#   https://github.com/<you>/<repo>/releases/latest/download/ODDKIN-Installer-Mac.pkg
#   https://github.com/<you>/<repo>/releases/latest/download/ODDKIN-Installer-Windows.exe
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: '[ -d JUCE ] || git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE'

      - name: Build VST3 + AU (universal)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target ODDKIN_VST3 ODDKIN_AU --parallel 4

      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          codesign --force --deep -s - build/ODDKIN_artefacts/Release/AU/ODDKIN.component
          cp -R build/ODDKIN_artefacts/Release/AU/ODDKIN.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Jkp1 Jkpa || echo "::warning::auval did not pass on the runner"

      # pluginval (Tracktion): loads the plug-in the way DAWs do and hammers it -
      # state save/restore, automation, odd block sizes and sample rates, editor open/close.
      - name: pluginval (VST3 + AU)
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/latest_release/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          codesign --force --deep -s - build/ODDKIN_artefacts/Release/VST3/ODDKIN.vst3
          $PV --strictness-level 5 --validate-in-process --timeout-ms 600000 --output-dir pluginval-logs --validate build/ODDKIN_artefacts/Release/VST3/ODDKIN.vst3
          $PV --strictness-level 5 --validate-in-process --timeout-ms 600000 --output-dir pluginval-logs --validate ~/Library/Audio/Plug-Ins/Components/ODDKIN.component

      # Optional: only runs if you've added Apple Developer certificates as repo secrets
      - name: Import signing certificates
        if: ${{ env.MAC_CERTS_P12 != '' }}
        env:
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          echo "$MAC_CERTS_P12" | base64 --decode > certs.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certs.p12 -k build.keychain -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm certs.p12

      - name: Make installer (.pkg, installs plug-ins + uninstaller)
        env:
          ODDKIN_SIGN_APP_ID: ${{ secrets.ODDKIN_SIGN_APP_ID }}
          ODDKIN_SIGN_INSTALLER_ID: ${{ secrets.ODDKIN_SIGN_INSTALLER_ID }}
          ODDKIN_NOTARY_APPLE_ID: ${{ secrets.ODDKIN_NOTARY_APPLE_ID }}
          ODDKIN_NOTARY_TEAM_ID: ${{ secrets.ODDKIN_NOTARY_TEAM_ID }}
          ODDKIN_NOTARY_PASSWORD: ${{ secrets.ODDKIN_NOTARY_PASSWORD }}
        run: ./installer/mac/make_installer.sh

      - name: Check the package
        run: |
          ls -la dist
          pkgutil --payload-files dist/ODDKIN-Installer-Mac.pkg | head -30
          # upgrade from the last JACKPOT release: the old copy must be gone afterwards
          curl -fsSL -o /tmp/old.pkg https://github.com/JojoMFKZ/Jackpot/releases/download/v1.1.0/JACKPOT-Installer-Mac.pkg
          sudo installer -pkg /tmp/old.pkg -target /
          test -d /Library/Audio/Plug-Ins/VST3/JACKPOT.vst3
          sudo installer -pkg dist/ODDKIN-Installer-Mac.pkg -target /
          test ! -e /Library/Audio/Plug-Ins/VST3/JACKPOT.vst3
          test ! -e /Library/Audio/Plug-Ins/Components/JACKPOT.component
          test ! -e "/Applications/Jackpot Audio"
          test -d /Library/Audio/Plug-Ins/VST3/ODDKIN.vst3
          test -d /Library/Audio/Plug-Ins/Components/ODDKIN.component
          test -d "/Applications/Oddkin/Uninstall ODDKIN.app"
          echo "Mac install (and upgrade from JACKPOT) worked."

      - uses: actions/upload-artifact@v4
        with:
          name: ODDKIN-mac-installer
          path: dist/*.pkg


  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        shell: bash
        run: '[ -d JUCE ] || git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE'

      - name: Build VST3
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target ODDKIN_VST3 --parallel 4

      - name: pluginval (VST3)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/latest_release/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          $pvArgs = '--strictness-level 5 --validate-in-process --timeout-ms 600000 --output-dir pluginval-logs --validate "build\ODDKIN_artefacts\Release\VST3\ODDKIN.vst3"'
          $p = Start-Process pv\pluginval.exe -ArgumentList $pvArgs -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-logs -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 40 }
          if ($p.ExitCode -ne 0) { throw "pluginval failed ($($p.ExitCode))" }

      - name: Get Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Make installer (setup.exe with uninstaller)
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(ODDKIN VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\windows\ODDKIN.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test install + uninstall
        shell: pwsh
        run: |
          # upgrade from the last JACKPOT release: the old copy must be gone afterwards
          Invoke-WebRequest -Uri https://github.com/JojoMFKZ/Jackpot/releases/download/v1.1.0/JACKPOT-Installer-Windows.exe -OutFile old.exe
          Start-Process .\old.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (-not (Test-Path "$env:CommonProgramFiles\VST3\JACKPOT.vst3")) { throw "old JACKPOT didn't install" }
          $setup = Get-ChildItem dist\ODDKIN-Installer-Windows.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (Test-Path "$env:CommonProgramFiles\VST3\JACKPOT.vst3") { throw "old JACKPOT.vst3 still there after upgrade" }
          if (Test-Path "$env:ProgramFiles\Jackpot Audio") { throw "old program folder still there after upgrade" }
          if (-not (Test-Path "$env:CommonProgramFiles\VST3\ODDKIN.vst3\Contents\x86_64-win\ODDKIN.vst3")) { throw "VST3 not installed" }
          $un = Get-ChildItem "$env:ProgramFiles\Oddkin\ODDKIN\unins*.exe" | Select-Object -First 1
          Start-Process $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$env:CommonProgramFiles\VST3\ODDKIN.vst3") { throw "VST3 not removed by uninstaller" }
          Write-Host "Install and uninstall both worked."

      - uses: actions/upload-artifact@v4
        with:
          name: ODDKIN-windows-installer
          path: dist/*.exe

  # Publish the two installers as the download page (GitHub Release).
  release:
    needs: [mac, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        run: |
          V=$(sed -n 's/^project(ODDKIN VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "VERSION=$V" >> $GITHUB_ENV
          mkdir out
          cp artifacts/ODDKIN-mac-installer/ODDKIN-Installer-Mac.pkg out/
          cp artifacts/ODDKIN-windows-installer/ODDKIN-Installer-Windows.exe out/
          ls -la out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ODDKIN ${{ env.VERSION }}
          make_latest: true
          files: |
            out/ODDKIN-Installer-Mac.pkg
            out/ODDKIN-Installer-Windows.exe
          body: |
            ## Download

            ### [⬇ Mac](https://github.com/${{ github.repository }}/releases/latest/download/ODDKIN-Installer-Mac.pkg)  ·  [⬇ Windows](https://github.com/${{ github.repository }}/releases/latest/download/ODDKIN-Installer-Windows.exe)

            Open the file you downloaded and click through. That's it.

            - **Mac blocked it?** System Settings > Privacy & Security > scroll down > **Open Anyway**.
            - **Windows "protected your PC"?** **More info** > **Run anyway**.
            - **Ableton:** Settings > Plug-Ins > turn on **Use VST3 Plug-In System Folders** > **Rescan**.

            Uninstall: Mac: Applications > Oddkin > Uninstall ODDKIN. Windows: Settings > Apps > ODDKIN.
